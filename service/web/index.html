<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFDA — IoT Firmware Deep Analysis</title>
<script>
  // Apply the saved theme/language before first paint to avoid a flash of the default.
  document.documentElement.setAttribute(
    "data-theme", localStorage.getItem("ifda-theme") || "midnight");
  document.documentElement.lang =
    (localStorage.getItem("ifda-lang") || "en") === "zh" ? "zh-CN" : "en";
</script>
<style>
  /* Themes ported from cn0xroot/AI_Web_Search (Genspark-style). Severity hues are
     shared; per-theme blocks override the surface/accent palette + --code. */
  :root { --crit:#ef4444; --high:#f97316; --med:#eab308; --low:#22c55e; --info:#38bdf8;
          --ok:#22c55e; --bad:#ef4444; --warn:#eab308; --login-bg-tint:55%; }
  :root, [data-theme="midnight"] {
    --bg:#07080f; --surface:#0d1117; --panel:#111827; --panel2:#161f2e;
    --line:#1e2a3a; --line2:#243044; --fg:#f1f5f9; --muted:#64748b; --soft:#94a3b8;
    --accent:#6366f1; --accent-h:#818cf8; --accent2:#a78bfa; --code:#0b0f15; }
  [data-theme="ocean"] {
    --bg:#060d14; --surface:#0a1622; --panel:#0f1f30; --panel2:#16293d;
    --line:#1c3147; --line2:#244056; --fg:#e6f1f7; --muted:#5b7488; --soft:#93b4c8;
    --accent:#0ea5e9; --accent-h:#38bdf8; --accent2:#22d3ee; --code:#06101a; }
  [data-theme="forest"] {
    --bg:#060f0a; --surface:#0b1810; --panel:#102217; --panel2:#16301f;
    --line:#1d3a28; --line2:#265034; --fg:#ecf6ef; --muted:#5f7d68; --soft:#9bbfa3;
    --accent:#22c55e; --accent-h:#4ade80; --accent2:#84cc16; --code:#08130d; }
  [data-theme="dusk"] {
    --bg:#0f0a16; --surface:#160f20; --panel:#1d142b; --panel2:#271a39;
    --line:#322247; --line2:#412e5c; --fg:#f2ecf7; --muted:#76688a; --soft:#b3a5c8;
    --accent:#a855f7; --accent-h:#c084fc; --accent2:#f59e0b; --code:#0c0814; }
  [data-theme="rose"] {
    --bg:#14070d; --surface:#1d0c14; --panel:#27121c; --panel2:#341925;
    --line:#42232f; --line2:#552e3e; --fg:#f7eef1; --muted:#8a6670; --soft:#c8a3ad;
    --accent:#f43f5e; --accent-h:#fb7185; --accent2:#fb923c; --code:#11060b; }
  [data-theme="nord"] {
    --bg:#2e3440; --surface:#333b48; --panel:#3b4252; --panel2:#434c5e;
    --line:#4c566a; --line2:#5a657c; --fg:#eceff4; --muted:#7b88a1; --soft:#d8dee9;
    --accent:#88c0d0; --accent-h:#8fbcbb; --accent2:#81a1c1; --code:#272c36; }
  [data-theme="light"] {
    --bg:#f8fafc; --surface:#ffffff; --panel:#ffffff; --panel2:#f1f5f9;
    --line:#e2e8f0; --line2:#cbd5e1; --fg:#0f172a; --muted:#64748b; --soft:#475569;
    --accent:#6366f1; --accent-h:#4f46e5; --accent2:#a855f7; --code:#f1f5f9;
    --login-bg-tint:85%; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:.02em;
              background:linear-gradient(90deg,var(--accent),var(--accent2));
              -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  header .tag { color:var(--muted); font-size:12px; }
  header .spacer { flex:1; }
  select.themesel, select.langsel { width:auto; padding:5px 8px; font-size:12px; cursor:pointer; }
  input.actorbox { width:120px; padding:5px 8px; font-size:12px; }
  button.ghost.active { border-color:var(--accent); color:var(--accent); }

  .usermenu { position:relative; }
  .usermenu-btn { display:flex; align-items:center; gap:6px; }
  .usermenu-btn .usericon { font-size:12px; line-height:1; }
  .usermenu-btn .caret { font-size:9px; color:var(--muted); }
  .usermenu-dropdown { position:absolute; top:calc(100% + 8px); right:0; z-index:50; width:200px;
        background:color-mix(in srgb, var(--panel) 96%, transparent); backdrop-filter:blur(16px);
        border:1px solid var(--line); border-radius:12px; padding:8px;
        box-shadow:0 16px 40px -12px rgba(0,0,0,.45); display:flex; flex-direction:column; gap:2px; }
  .usermenu-hdr { padding:8px 9px 10px; margin-bottom:4px; border-bottom:1px solid var(--line);
        font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:2px; }
  .usermenu-hdr strong { color:var(--fg); font-size:13px; }
  .usermenu-dropdown button { background:none; border:0; color:var(--fg); text-align:left;
        padding:8px 9px; border-radius:7px; font-size:13px; font-weight:500; }
  .usermenu-dropdown button:hover { background:var(--panel2); }
  main { display:grid; grid-template-columns:380px 1fr; height:calc(100vh - 50px); }
  .left { border-right:1px solid var(--line); overflow-y:auto; padding:14px; }
  .right { overflow-y:auto; padding:18px 22px; }

  input, select, button { font:inherit; }
  input[type=text], select { background:var(--panel); border:1px solid var(--line);
        color:var(--fg); padding:7px 9px; border-radius:6px; font-size:13px; width:100%; }
  .submit { display:flex; gap:6px; margin-bottom:8px; }
  .submit input { flex:1; }
  button { background:var(--accent); border:0; color:#fff; padding:7px 13px; border-radius:6px;
           cursor:pointer; font-size:13px; font-weight:600; white-space:nowrap; }
  button:hover { background:var(--accent-h); }
  button.ghost { background:var(--panel2); border:1px solid var(--line); color:var(--fg); }
  button.ghost:hover { border-color:var(--accent); }
  button.sm { padding:3px 8px; font-size:11px; }
  .uprow { display:flex; gap:6px; align-items:center; margin-bottom:14px; font-size:12px;
           color:var(--muted); }
  .uprow label { cursor:pointer; color:var(--accent); }
  .uprow input[type=file] { display:none; }

  .batchbar { display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12px; color:var(--muted); }
  .batchbar .chk { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .batchbar .chk input { width:auto; }
  .job { background:var(--panel); border:1px solid var(--line); border-radius:10px;
         padding:11px 13px; margin-bottom:8px; cursor:pointer; transition:border-color .15s; }
  .job:hover { border-color:var(--line2); }
  .job.sel { border-color:var(--accent); background:var(--panel2); }
  .job .row1 { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .job .targetwrap { min-width:0; flex:1; }
  .job .target-name { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; font-weight:600;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .job .target-dir { font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--muted);
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
  .badge { font-size:10px; padding:1px 7px; border-radius:10px; text-transform:uppercase;
           letter-spacing:.04em; font-weight:700; }
  .badge.queued{background:var(--line2);color:var(--soft)} .badge.running{background:var(--accent);color:#fff}
  .badge.completed{background:#16a34a;color:#fff} .badge.failed{background:var(--bad);color:#fff}
  .badge.paused{background:var(--warn);color:#0d1117} .badge.cancelled{background:var(--line2);color:var(--soft)}
  .jobctl { display:flex; gap:6px; margin-top:7px; }
  .proclog { background:var(--code); border:1px solid var(--line); border-radius:6px;
             padding:8px 10px; margin-top:10px; max-height:50vh; overflow-y:auto;
             font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .logrow { display:flex; gap:9px; padding:2px 0; border-bottom:1px solid var(--line); }
  .logrow:last-child { border-bottom:0; }
  .logrow .lt { color:var(--muted); white-space:nowrap; }
  .logrow .ls { color:var(--accent-h); white-space:nowrap; }
  .logrow .ld { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logrow .lp { color:var(--muted); white-space:nowrap; }
  .bar { height:5px; background:var(--line2); border-radius:4px; margin-top:7px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); transition:width .3s; }
  .meta { color:var(--muted); font-size:11px; margin-top:5px; display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  .meta .time-ago { margin-left:auto; white-space:nowrap; }

  .sev-crit{color:var(--crit)} .sev-high{color:var(--high)} .sev-med{color:var(--med)}
  .sev-low{color:var(--low)} .sev-info{color:var(--info)}
  .bg-crit{background:var(--crit)} .bg-high{background:var(--high)} .bg-med{background:var(--med)}
  .bg-low{background:var(--low)} .bg-info{background:var(--info)}

  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .tabs button { background:none; color:var(--muted); border:0; border-bottom:2px solid transparent;
        border-radius:0; padding:8px 14px; font-weight:600; }
  .tabs button.active { color:var(--fg); border-bottom-color:var(--accent); }
  .tabs .spacer { flex:1; }
  .tabs .exp { display:flex; gap:6px; align-items:center; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px;
           margin-bottom:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card.clickable { cursor:pointer; } .card.clickable:hover { border-color:var(--accent); }
  .card .n { font-size:26px; font-weight:700; line-height:1.1; }
  .card .l { color:var(--muted); font-size:12px; margin-top:2px; }

  .distro { background:var(--panel); border:1px solid var(--line); border-radius:8px;
            padding:14px 16px; margin-bottom:18px; }
  .distro h3, .table-wrap h3 { margin:0 0 10px; font-size:13px; color:var(--muted);
            text-transform:uppercase; letter-spacing:.05em; }
  .drow { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .drow.clickable { cursor:pointer; border-radius:4px; }
  .drow.clickable:hover { background:var(--panel2); }
  .drow .k { width:74px; font-size:12px; text-transform:capitalize; }
  .drow .t { flex:1; height:16px; background:var(--line2); border-radius:4px; overflow:hidden; }
  .drow .t > span { display:block; height:100%; border-radius:4px; }
  .drow .v { width:34px; text-align:right; font-variant-numeric:tabular-nums; font-size:12px; }

  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;
             background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .filters .sevtog { display:flex; gap:4px; }
  .filters .sevtog button { padding:3px 9px; font-size:11px; border-radius:12px;
        background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-weight:700; }
  .filters .sevtog button.on { color:#fff; }
  .filters select { width:auto; min-width:120px; }
  .filters input[type=text] { width:180px; }
  .filters .rng { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .filters .count { margin-left:auto; color:var(--muted); font-size:12px; }

  .finding { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line);
        border-radius:7px; margin-bottom:9px; }
  .finding.crit{border-left-color:var(--crit)} .finding.high{border-left-color:var(--high)}
  .finding.med{border-left-color:var(--med)} .finding.low{border-left-color:var(--low)}
  .finding.info{border-left-color:var(--info)}
  .finding .hd { display:flex; align-items:center; gap:10px; padding:10px 13px; cursor:pointer; }
  .finding .hd .t { font-weight:600; flex:1; }
  .finding .hd .sevtag { font-size:10px; font-weight:700; text-transform:uppercase; padding:1px 7px;
        border-radius:4px; color:#0d1117; }
  .finding .body { padding:0 13px 12px; border-top:1px solid var(--line); }
  .finding .sub { color:var(--muted); font-size:12px; margin:8px 0; }
  .finding .desc { font-size:13px; margin:8px 0; }
  .ev { background:var(--code); border:1px solid var(--line); border-radius:5px; padding:7px 9px;
        font-family:ui-monospace,Menlo,monospace; font-size:12px; margin-top:6px;
        white-space:pre-wrap; word-break:break-word; }
  .ev .loc { color:var(--muted); }
  .taint { color:var(--high); }
  pre.code { background:var(--code); border:1px solid var(--line); border-radius:5px; padding:9px 11px;
        font-family:ui-monospace,Menlo,monospace; font-size:12px; overflow-x:auto; margin:6px 0 0; }
  .tristrip { display:flex; gap:6px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .tristrip .lab { color:var(--muted); font-size:12px; }
  .tristrip .cur { font-size:11px; font-weight:700; padding:1px 8px; border-radius:10px;
        border:1px solid var(--line); }
  .tristrip .cur.confirmed{color:var(--high);border-color:var(--high)}
  .tristrip .cur.false_positive{color:var(--muted)}
  .tristrip .cur.accepted_risk{color:var(--med);border-color:var(--med)}

  table.bins { width:100%; border-collapse:collapse; font-size:13px; }
  table.bins th, table.bins td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  table.bins th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  table.bins td.path { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .chip { display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px;
          margin:1px 2px; }
  .chip.ok{background:rgba(34,197,94,.15);color:var(--ok)}
  .chip.bad{background:rgba(239,68,68,.15);color:var(--bad)}
  .chip.warn{background:rgba(234,179,8,.15);color:var(--warn)}
  .chip.neutral{background:var(--panel2);color:var(--muted)}

  .vulndb-coverage { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 16px; }
  .vulndb-checkers { margin-bottom:20px; }
  .vulndb-checkers summary { cursor:pointer; color:var(--muted); font-size:12px; margin-bottom:8px; }
  .vulndb-checkers input { margin-bottom:8px; }
  .checker-chips { display:flex; flex-wrap:wrap; gap:2px; max-height:220px; overflow-y:auto; }

  .empty { color:var(--muted); text-align:center; margin-top:64px; }
  .loadingBox { display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:80px; color:var(--muted); }
  .spinner { width:34px; height:34px; border-radius:50%; border:3px solid var(--line);
             border-top-color:var(--accent); animation:spin .8s linear infinite; }
  .spinner.sm { width:16px; height:16px; border-width:2px; display:inline-block; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .kwrow { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
  .kwchip { display:inline-flex; align-items:center; gap:5px; background:var(--panel2);
            border:1px solid var(--line); border-radius:14px; padding:3px 4px 3px 10px; font-size:12px; }
  .kwchip button { background:none; color:var(--muted); padding:0 5px; font-size:13px; font-weight:700;
                   border-radius:50%; line-height:1.4; }
  .kwchip button:hover { color:var(--bad); background:none; }
  .kwadd { display:flex; gap:6px; margin-bottom:14px; }
  .kwadd input { width:220px; }

  .loginOverlay { position:fixed; inset:0; z-index:1000; overflow:hidden;
                  display:flex; align-items:center; justify-content:center;
                  background:
                    radial-gradient(ellipse 900px 560px at 12% 15%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 62%),
                    radial-gradient(ellipse 760px 520px at 88% 85%, color-mix(in srgb, var(--accent2) 20%, transparent), transparent 62%),
                    radial-gradient(ellipse 1000px 700px at 50% 50%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%),
                    linear-gradient(color-mix(in srgb, var(--bg) var(--login-bg-tint), transparent),
                                     color-mix(in srgb, var(--bg) var(--login-bg-tint), transparent)),
                    url('login-bg.jpg') center/cover no-repeat,
                    var(--bg); }
  .loginOverlay::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.6;
                  background-image: radial-gradient(circle, color-mix(in srgb, var(--soft) 35%, transparent) 1px, transparent 1px);
                  background-size: 26px 26px;
                  mask-image: radial-gradient(ellipse 65% 55% at 50% 45%, black, transparent 75%);
                  -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 45%, black, transparent 75%); }
  .loginTopBar { position:absolute; top:22px; right:26px; display:flex; gap:8px; z-index:2; }
  .loginCard { position:relative; z-index:1;
               background: color-mix(in srgb, var(--panel) 90%, transparent);
               backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
               border:1px solid color-mix(in srgb, var(--line2) 80%, transparent); border-radius:20px;
               padding:46px 40px 38px; width:380px;
               display:flex; flex-direction:column; align-items:stretch; gap:13px;
               box-shadow: 0 30px 70px -24px rgba(0,0,0,.55),
                           0 0 0 1px color-mix(in srgb, var(--accent) 6%, transparent);
               animation: loginIn .55s cubic-bezier(.16,1,.3,1); }
  @keyframes loginIn { from { opacity:0; transform:translateY(16px) scale(.97); } to { opacity:1; transform:none; } }
  .loginMark { width:60px; height:60px; margin:0 auto 8px; border-radius:18px;
               background:linear-gradient(135deg,var(--accent),var(--accent2));
               display:flex; align-items:center; justify-content:center;
               box-shadow: 0 14px 34px -10px color-mix(in srgb, var(--accent) 65%, transparent); }
  .loginMark svg { width:32px; height:32px; stroke:#fff; }
  .modalClose { position:absolute; top:14px; right:14px; width:26px; height:26px; padding:0;
               background:var(--panel2); border:1px solid var(--line); border-radius:50%;
               color:var(--muted); font-size:15px; line-height:1; display:flex;
               align-items:center; justify-content:center; }
  .modalClose:hover { color:var(--fg); border-color:var(--line2); }
  .loginCard h2 { margin:0; text-align:center; font-size:26px; letter-spacing:.02em;
                  background:linear-gradient(90deg,var(--accent),var(--accent2));
                  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .loginFullname { margin:2px 0 0; text-align:center; font-size:12px; font-weight:600;
                   letter-spacing:.03em; color:var(--soft); text-transform:uppercase; }
  .loginCard .tag { margin:0 0 10px; text-align:center; font-size:13px; }
  .loginCard input[type=text], .loginCard input[type=password] {
        padding:12px 15px; border-radius:11px; font-size:14px;
        background:color-mix(in srgb, var(--panel2) 80%, transparent);
        border:1px solid var(--line); transition:border-color .15s, box-shadow .15s; }
  .loginCard input[type=text]:focus, .loginCard input[type=password]:focus {
        outline:none; border-color:var(--accent);
        box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .loginCard button[type=submit] { margin-top:8px; padding:12px 15px; border-radius:11px; font-size:14px;
        background:linear-gradient(90deg,var(--accent),var(--accent2)); letter-spacing:.02em;
        box-shadow:0 12px 26px -10px color-mix(in srgb, var(--accent) 55%, transparent);
        transition:transform .15s, box-shadow .15s; }
  .loginCard button[type=submit]:hover { transform:translateY(-1px);
        box-shadow:0 16px 30px -10px color-mix(in srgb, var(--accent) 65%, transparent); }
  .loginCard button[type=submit]:active { transform:translateY(0); }
  .captchaRow { display:flex; gap:8px; align-items:center; }
  .captchaRow img { height:42px; border-radius:8px; border:1px solid var(--line); cursor:pointer; }
  .captchaRow input { flex:1; }
</style>
</head>
<body x-data="app()" x-init="init()">
<!-- LOGIN -->
<div class="loginOverlay" x-show="showLogin" style="display:none" x-effect="showLogin && refreshCaptcha()">
  <div class="loginTopBar">
    <select class="themesel" x-model="theme" @change="applyTheme()" title="Theme / 主题">
      <option value="midnight">🌙 暗夜 Midnight</option>
      <option value="ocean">🌊 海洋 Ocean</option>
      <option value="forest">🌲 森林 Forest</option>
      <option value="dusk">🌆 暮色 Dusk</option>
      <option value="rose">🌹 玫瑰 Rose</option>
      <option value="nord">❄️ Nord</option>
      <option value="light">☀️ 浅色 Light</option>
    </select>
    <select class="langsel" x-model="lang" @change="applyLang()" title="Language / 语言">
      <option value="en">EN English</option>
      <option value="zh">中文 Chinese</option>
    </select>
  </div>
  <form class="loginCard" @submit.prevent="doLogin()">
    <div class="loginMark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 4 5.5v6c0 5 3.4 8.5 8 9.5 4.6-1 8-4.5 8-9.5v-6L12 2Z"/>
        <path d="M9.5 12.2 11.3 14l3.4-4"/>
      </svg>
    </div>
    <h2>IFDA</h2>
    <p class="loginFullname" x-text="t('tagline')"></p>
    <p class="tag" x-text="t('login_subtitle')"></p>
    <input type="text" x-model="loginUser" :placeholder="t('login_username')" autocomplete="username" autofocus>
    <input type="password" x-model="loginPass" :placeholder="t('login_password')" autocomplete="current-password">
    <div class="captchaRow" x-show="captchaImg">
      <img :src="captchaImg" :alt="t('login_captcha')" @click="refreshCaptcha()" :title="t('captcha_refresh_hint')">
      <input type="text" x-model="captchaAnswer" :placeholder="t('login_captcha')" autocomplete="off" maxlength="8">
    </div>
    <button type="submit" x-text="t('login_submit')"></button>
    <p class="sev-crit" x-show="loginError" x-text="loginError"></p>
  </form>
</div>
<!-- CHANGE PASSWORD -->
<div class="loginOverlay" x-show="showChangePassword" style="display:none" @click.self="showChangePassword=false">
  <form class="loginCard" @submit.prevent="doChangePassword()">
    <button type="button" class="modalClose" @click="showChangePassword=false" title="Close">×</button>
    <div class="loginMark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.5" cy="15.5" r="4.5"/>
        <path d="M11 12 20 3"/>
        <path d="M16 7l3 3"/>
      </svg>
    </div>
    <h2 x-text="t('change_password_title')"></h2>
    <p class="tag" x-text="t('change_password_hint')"></p>
    <input type="password" x-model="oldPassword" :placeholder="t('old_password')" autocomplete="current-password" autofocus>
    <input type="password" x-model="newPassword" :placeholder="t('new_password')" autocomplete="new-password">
    <input type="password" x-model="newPassword2" :placeholder="t('confirm_new_password')" autocomplete="new-password">
    <button type="submit" x-text="t('change_password_submit')"></button>
    <p class="sev-crit" x-show="changePasswordError" x-text="changePasswordError"></p>
    <p class="sev-low" x-show="changePasswordOk" x-text="t('change_password_ok')"></p>
  </form>
</div>
<header>
  <h1>IFDA</h1>
  <span class="tag" x-text="t('tagline')"></span>
  <span class="spacer"></span>
  <span class="tag" x-show="report" x-text="summaryText()"></span>
  <input type="text" class="actorbox" x-model="actor" @change="localStorage.setItem('ifda-actor', actor)"
         :placeholder="t('actor_placeholder')" :title="t('actor_hint')">
  <button class="ghost sm" :class="{active: compareMode}" @click="toggleCompare()" x-text="t('btn_compare')"></button>
  <button class="ghost sm" :class="{active: showVulnDB}" @click="toggleVulnDB()" x-text="t('btn_vulndb')"></button>
  <button class="ghost sm" :class="{active: showSensitiveDict}" @click="toggleSensitiveDict()" x-text="t('btn_sensitive_dict')"></button>
  <div class="usermenu" x-show="loginRequired && authToken" x-data="{}" @click.outside="showUserMenu=false">
    <button class="ghost sm usermenu-btn" :class="{active: showUserMenu}" @click="showUserMenu=!showUserMenu">
      <span class="usericon">👤</span><span x-text="username||t('user_center')"></span>
      <span class="caret" x-text="showUserMenu?'▴':'▾'"></span>
    </button>
    <div class="usermenu-dropdown" x-show="showUserMenu" style="display:none" x-transition>
      <div class="usermenu-hdr">
        <span x-text="t('signed_in_as')"></span>
        <strong x-text="username||'—'"></strong>
      </div>
      <button type="button" @click="showUserMenu=false; openChangePassword()" x-text="t('btn_change_password')"></button>
      <button type="button" @click="showUserMenu=false; doLogout()" x-text="t('btn_logout')"></button>
    </div>
  </div>
  <select class="langsel" x-model="lang" @change="applyLang()" title="Language / 语言">
    <option value="en">EN English</option>
    <option value="zh">中文 Chinese</option>
  </select>
  <select class="themesel" x-model="theme" @change="applyTheme()" title="Theme / 主题">
    <option value="midnight">🌙 暗夜 Midnight</option>
    <option value="ocean">🌊 海洋 Ocean</option>
    <option value="forest">🌲 森林 Forest</option>
    <option value="dusk">🌆 暮色 Dusk</option>
    <option value="rose">🌹 玫瑰 Rose</option>
    <option value="nord">❄️ Nord</option>
    <option value="light">☀️ 浅色 Light</option>
  </select>
</header>

<main>
  <!-- LEFT: submit + job list -->
  <div class="left">
    <div class="submit">
      <input type="text" x-model="target" :placeholder="t('target_placeholder')"
             @keydown.enter="submit()">
      <button @click="submit()" x-text="t('analyze')"></button>
    </div>
    <div class="uprow">
      <label :title="ghidraAvailable ? '' : t('decompile_unavailable_hint')">
        <input type="checkbox" x-model="decompile" :disabled="!ghidraAvailable"
               style="width:auto;display:inline;vertical-align:middle;margin-right:5px">
        <span x-text="t('decompile_label')"></span>
      </label>
      <span x-show="!ghidraAvailable" class="chip warn" x-text="t('decompile_unavailable')"></span>
    </div>
    <div class="uprow">
      <label>
        <span x-text="uploading ? t('uploading') : t('upload_file')"></span>
        <input type="file" @change="upload($event)">
      </label>
      <span x-text="t('upload_hint')"></span>
    </div>

    <template x-if="!jobs.length">
      <div class="empty" x-text="t('no_jobs')"></div>
    </template>
    <div class="batchbar" x-show="deletableJobs.length">
      <label class="chk"><input type="checkbox" :checked="deleteSelected.length && deleteSelected.length===deletableJobs.length"
                                 @change="selectAllForDelete()">
        <span x-text="t('select_all')"></span></label>
      <button class="ghost sm" x-show="deleteSelected.length" @click="deleteSelectedJobs()"
              x-text="`${t('btn_delete_selected')} (${deleteSelected.length})`"></button>
    </div>
    <template x-for="j in jobs" :key="j.id">
      <div class="job" :class="{sel: j.id===selectedId}" @click="select(j.id)">
        <div class="row1">
          <input type="checkbox" x-show="['completed','failed','cancelled'].includes(j.status)"
                 :checked="deleteSelected.includes(j.id)" @click.stop="toggleDeleteSelect(j.id)"
                 style="width:auto;flex:none">
          <div class="targetwrap">
            <div class="target-name" :title="j.target" x-text="targetName(j.target)"></div>
            <div class="target-dir" x-show="targetDir(j.target)" :title="j.target" x-text="targetDir(j.target)"></div>
          </div>
          <span class="badge" :class="j.status" x-text="tStatus(j.status)"></span>
        </div>
        <div class="bar"><span :style="`width:${j.progress}%`"></span></div>
        <div class="meta">
          <span x-show="['queued','running'].includes(j.status) && !j.stage" class="spinner sm"></span>
          <span x-text="(j.stage||(j.status==='queued'?t('waiting_to_start'):'—'))+' '+j.progress+'%'"></span>
          <span x-show="j.detail && j.status!=='completed'" x-text="j.detail"></span>
          <template x-if="j.status==='completed'">
            <span style="display:flex;gap:4px;align-items:center">
              <span class="chip" :class="j.high_crit>0 ? 'bad' : 'ok'" x-text="j.findings+' '+t('chip_findings')"></span>
              <template x-if="j.high_crit>0"><span class="chip bad" x-text="j.high_crit+' '+t('chip_highcrit')"></span></template>
              <template x-if="j.cache_hit"><span class="chip neutral" x-text="t('cached')"></span></template>
            </span>
          </template>
          <span x-show="j.status==='failed'" class="sev-crit" x-text="j.error||tStatus('failed')"></span>
          <span class="time-ago" x-text="timeAgo(j.finished_at||j.created_at)"></span>
        </div>
        <div class="jobctl" x-show="['queued','running','paused'].includes(j.status)" @click.stop>
          <button class="ghost sm" x-show="j.status==='running'" @click="pauseJob(j.id)" x-text="t('btn_pause')"></button>
          <button class="ghost sm" x-show="j.status==='paused'" @click="resumeJob(j.id)" x-text="t('btn_resume')"></button>
          <button class="ghost sm" @click="stopJob(j.id)" x-text="t('btn_stop')"></button>
        </div>
        <div class="jobctl" x-show="['completed','failed','cancelled'].includes(j.status)" @click.stop>
          <button class="ghost sm" @click="deleteJob(j.id)" x-text="t('btn_delete')"></button>
        </div>
      </div>
    </template>
  </div>

  <!-- RIGHT: report views -->
  <div class="right">
    <!-- CVE DATABASE -->
    <template x-if="showVulnDB">
      <div>
        <h2 x-text="t('btn_vulndb')"></h2>
        <p class="tag" x-text="t('vulndb_hint')"></p>
        <template x-if="vulnDBLoading">
          <div class="loadingBox"><div class="spinner"></div><div x-text="t('loading')"></div></div>
        </template>
        <template x-if="!vulnDBLoading">
          <div>
            <div class="vulndb-coverage">
              <span class="chip" :class="vulnDBCoverage?.available ? 'ok' : 'bad'"
                    x-text="vulnDBCoverage?.available ? t('vulndb_cvebin_yes') : t('vulndb_cvebin_no')"></span>
              <template x-if="vulnDBCoverage?.available">
                <span class="tag">
                  <span x-text="vulnDBCoverage.checker_count"></span>
                  <span x-text="t('vulndb_cvebin_components')"></span>
                  (<span x-text="(vulnDBCoverage.data_sources||[]).join(', ')"></span>)
                </span>
              </template>
            </div>
            <template x-if="vulnDBCoverage?.available">
              <div class="tag" style="margin-bottom:14px">
                <span x-text="t('vulndb_cve_count_label')"></span>:
                <strong x-text="(vulnDBCoverage.cve_count_total||0).toLocaleString()"></strong>
                <template x-if="vulnDBCoverage.cve_counts && Object.keys(vulnDBCoverage.cve_counts).length">
                  <span>
                    (<template x-for="(n, src) in vulnDBCoverage.cve_counts" :key="src"><span x-text="src+': '+n.toLocaleString()+'  '"></span></template>)
                  </span>
                </template>
                <br><span x-text="t('vulndb_cve_count_hint')"></span>
              </div>
            </template>
            <template x-if="vulnDBCoverage?.available && vulnDBCoverage.checkers?.length">
              <details class="vulndb-checkers">
                <summary x-text="t('vulndb_checkers_summary')"></summary>
                <input type="text" class="sm" :placeholder="t('vulndb_checkers_filter')" x-model="vulnDBCheckerFilter">
                <div class="checker-chips">
                  <template x-for="name in filteredCheckers" :key="name">
                    <span class="chip neutral" x-text="name"></span>
                  </template>
                </div>
              </details>
            </template>

            <h3 x-text="t('vulndb_curated_heading')"></h3>
            <template x-if="vulnDBRows.length">
              <div class="table-wrap">
                <table class="bins">
                  <thead><tr>
                    <th x-text="t('th_component')"></th><th x-text="t('th_cves')"></th>
                    <th x-text="t('th_severity')"></th><th x-text="t('th_affected_versions')"></th>
                    <th x-text="t('th_summary')"></th>
                  </tr></thead>
                  <tbody>
                    <template x-for="row in vulnDBRows" :key="row.component+row.cve">
                      <tr>
                        <td x-text="row.component"></td>
                        <td x-text="row.cve"></td>
                        <td><span class="sevtag" :class="'bg-'+SHORT[row.severity]" x-text="tSev(row.severity)"></span></td>
                        <td x-text="row.versionText"></td>
                        <td x-text="row.summary"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
            <template x-if="!vulnDBRows.length"><div class="empty" x-text="t('vulndb_empty')"></div></template>
          </div>
        </template>
      </div>
    </template>

    <!-- SENSITIVE-STRING DICTIONARY (standalone management, independent of any scan) -->
    <template x-if="showSensitiveDict">
      <div>
        <h2 x-text="t('btn_sensitive_dict')"></h2>
        <p class="tag" x-text="t('kw_help')"></p>
        <div class="kwrow">
          <template x-for="k in sensitiveKeywords" :key="k">
            <span class="kwchip"><span x-text="k"></span>
              <button type="button" @click="removeKeyword(k)" title="remove">×</button></span>
          </template>
        </div>
        <div class="kwadd">
          <input type="text" x-model="newKeyword" @keydown.enter="addKeyword()"
                 :placeholder="t('kw_add_placeholder')">
          <button class="ghost sm" @click="addKeyword()" x-text="t('kw_add_btn')"></button>
          <button class="ghost sm" @click="resetKeywords()" x-text="t('kw_reset_btn')"></button>
        </div>
        <p class="meta" x-text="sensitiveKeywords.length+' '+t('kw_count_label')"></p>
      </div>
    </template>

    <!-- COMPARE -->
    <template x-if="!showVulnDB && !showSensitiveDict && compareMode">
      <div>
        <h2 x-text="t('btn_compare')"></h2>
        <div class="filters">
          <select x-model="compareA">
            <option value="" x-text="t('compare_pick_a')"></option>
            <template x-for="j in completedJobs" :key="j.id">
              <option :value="j.id" x-text="j.target+' ('+j.id+')'"></option>
            </template>
          </select>
          <select x-model="compareB">
            <option value="" x-text="t('compare_pick_b')"></option>
            <template x-for="j in completedJobs" :key="j.id">
              <option :value="j.id" x-text="j.target+' ('+j.id+')'"></option>
            </template>
          </select>
          <button @click="runCompare()" x-text="t('btn_run_compare')"></button>
        </div>
        <template x-if="comparing">
          <div class="loadingBox"><div class="spinner"></div><div x-text="t('comparing')"></div></div>
        </template>
        <template x-if="compareResult">
          <div>
            <div class="cards">
              <div class="card"><div class="n sev-crit" x-text="compareResult.added.length"></div><div class="l" x-text="t('compare_added')"></div></div>
              <div class="card"><div class="n sev-low" x-text="compareResult.removed.length"></div><div class="l" x-text="t('compare_removed')"></div></div>
              <div class="card"><div class="n" x-text="compareResult.common.length"></div><div class="l" x-text="t('compare_common')"></div></div>
            </div>
            <h3 x-text="t('compare_added')"></h3>
            <template x-if="!compareResult.added.length"><div class="empty" x-text="t('compare_none')"></div></template>
            <template x-for="(f, fidx) in compareResult.added" :key="f.id+'-'+fidx">
              <div class="finding" :class="SHORT[f.severity]" x-data="{open:false}">
                <div class="hd" @click="open=!open">
                  <span class="sevtag" :class="'bg-'+SHORT[f.severity]" x-text="tSev(f.severity)"></span>
                  <span class="t" x-text="f.title"></span>
                  <span class="sub" style="margin:0" x-text="f.vuln_class+' · '+Math.round(f.confidence*100)+'%'"></span>
                  <span x-show="f.cve_ids&&f.cve_ids.length" class="sub" style="margin:0" x-text="f.cve_ids.join(', ')"></span>
                  <span x-text="open?'▾':'▸'"></span>
                </div>
                <div class="body" x-show="open">
                  <div class="sub" x-text="t('component_label')+': '+f.component+'  ·  '+t('rule_label')+': '+f.rule+'  ·  '+t('id_label')+': '+f.id"></div>
                  <div class="desc" x-text="f.description"></div>
                  <template x-for="(e,i) in (f.evidence||[])" :key="i">
                    <div class="ev"><span class="loc" x-text="[e.binary,e.function,e.address].filter(Boolean).join(' : ')"></span><br>
                      <span x-text="e.snippet"></span>
                      <template x-if="e.taint_path && e.taint_path.length">
                        <div class="taint" x-text="'↳ '+e.taint_path.join(' → ')"></div>
                      </template>
                    </div>
                  </template>
                  <template x-if="f.pseudocode">
                    <details>
                      <summary style="cursor:pointer;color:var(--muted);font-size:12px;margin-top:8px" x-text="t('pseudocode_label')"></summary>
                      <pre class="code" x-text="f.pseudocode"></pre>
                    </details>
                  </template>
                  <div class="sub" x-show="f.remediation" x-text="'▸ '+f.remediation"></div>
                </div>
              </div>
            </template>
            <h3 style="margin-top:18px" x-text="t('compare_removed')"></h3>
            <template x-if="!compareResult.removed.length"><div class="empty" x-text="t('compare_none')"></div></template>
            <template x-for="(f, fidx) in compareResult.removed" :key="f.id+'-'+fidx">
              <div class="finding" :class="SHORT[f.severity]" x-data="{open:false}">
                <div class="hd" @click="open=!open">
                  <span class="sevtag" :class="'bg-'+SHORT[f.severity]" x-text="tSev(f.severity)"></span>
                  <span class="t" x-text="f.title"></span>
                  <span class="sub" style="margin:0" x-text="f.vuln_class+' · '+Math.round(f.confidence*100)+'%'"></span>
                  <span x-show="f.cve_ids&&f.cve_ids.length" class="sub" style="margin:0" x-text="f.cve_ids.join(', ')"></span>
                  <span x-text="open?'▾':'▸'"></span>
                </div>
                <div class="body" x-show="open">
                  <div class="sub" x-text="t('component_label')+': '+f.component+'  ·  '+t('rule_label')+': '+f.rule+'  ·  '+t('id_label')+': '+f.id"></div>
                  <div class="desc" x-text="f.description"></div>
                  <template x-for="(e,i) in (f.evidence||[])" :key="i">
                    <div class="ev"><span class="loc" x-text="[e.binary,e.function,e.address].filter(Boolean).join(' : ')"></span><br>
                      <span x-text="e.snippet"></span>
                      <template x-if="e.taint_path && e.taint_path.length">
                        <div class="taint" x-text="'↳ '+e.taint_path.join(' → ')"></div>
                      </template>
                    </div>
                  </template>
                  <template x-if="f.pseudocode">
                    <details>
                      <summary style="cursor:pointer;color:var(--muted);font-size:12px;margin-top:8px" x-text="t('pseudocode_label')"></summary>
                      <pre class="code" x-text="f.pseudocode"></pre>
                    </details>
                  </template>
                  <div class="sub" x-show="f.remediation" x-text="'▸ '+f.remediation"></div>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <template x-if="!showVulnDB && !showSensitiveDict && !compareMode && !selJob">
      <div class="empty" x-text="t('select_job')"></div>
    </template>

    <template x-if="!showVulnDB && !showSensitiveDict && !compareMode && selJob && selJob.status!=='completed'">
      <div>
        <h2 x-text="selJob.target"></h2>
        <p><span x-text="t('status_label')"></span> <span class="badge" :class="selJob.status" x-text="tStatus(selJob.status)"></span></p>
        <div class="bar" style="max-width:420px"><span :style="`width:${selJob.progress}%`"></span></div>
        <p class="meta">
          <span x-show="['queued','running'].includes(selJob.status) && !selJob.stage" class="spinner sm"></span>
          <span x-text="(selJob.stage||(selJob.status==='queued'?t('waiting_to_start'):''))+' — '+(selJob.detail||'')+' ('+selJob.progress+'%)'"></span>
        </p>
        <p x-show="selJob.status==='failed'" class="sev-crit" x-text="selJob.error"></p>
        <div class="jobctl" x-show="['queued','running','paused'].includes(selJob.status)">
          <button x-show="selJob.status==='running'" @click="pauseJob(selJob.id)" x-text="t('btn_pause')"></button>
          <button x-show="selJob.status==='paused'" @click="resumeJob(selJob.id)" x-text="t('btn_resume')"></button>
          <button class="ghost" @click="stopJob(selJob.id)" x-text="t('btn_stop')"></button>
        </div>
        <h3 style="margin-top:22px" x-text="t('process_log')"></h3>
        <template x-if="!(selJob.log&&selJob.log.length)"><div class="empty" style="margin-top:12px" x-text="t('no_log_yet')"></div></template>
        <div class="proclog" x-show="selJob.log&&selJob.log.length" x-ref="proclog"
             x-effect="selJob && selJob.log && selJob.log.length && $nextTick(() => { $refs.proclog.scrollTop = $refs.proclog.scrollHeight })">
          <template x-for="(e,i) in (selJob.log||[])" :key="i">
            <div class="logrow">
              <span class="lt" x-text="logTime(e.time)"></span>
              <span class="ls" x-text="e.stage"></span>
              <span class="ld" x-text="e.detail"></span>
              <span class="lp" x-text="e.pct+'%'"></span>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="!showVulnDB && !showSensitiveDict && !compareMode && selJob && selJob.status==='completed' && !report">
      <div class="loadingBox">
        <template x-if="!reportLoadError">
          <div class="spinner"></div>
        </template>
        <div x-show="!reportLoadError" x-text="t('loading_report')"></div>
        <template x-if="reportLoadError">
          <div style="text-align:center">
            <div class="sev-crit" x-text="t('report_load_failed')+': '+reportLoadError"></div>
            <button class="ghost sm" style="margin-top:10px" @click="loadReport(selJob.id)" x-text="t('btn_retry')"></button>
          </div>
        </template>
      </div>
    </template>

    <template x-if="!showVulnDB && !showSensitiveDict && !compareMode && selJob && selJob.status==='completed' && report">
      <div>
        <div class="tabs">
          <button :class="{active:tab==='dashboard'}" @click="tab='dashboard'" x-text="t('tab_dashboard')"></button>
          <button :class="{active:tab==='findings'}" @click="tab='findings'"
                  x-text="`${t('tab_findings')} (${findings.length})`"></button>
          <button :class="{active:tab==='binaries'}" @click="tab='binaries'"
                  x-text="`${t('tab_binaries')} (${binaries.length})`"></button>
          <button :class="{active:tab==='scripts'}" @click="tab='scripts'"
                  x-text="`${t('tab_scripts')} (${scripts.length})`"></button>
          <button :class="{active:tab==='components'}" @click="tab='components'"
                  x-text="`${t('tab_components')} (${components.length})`"></button>
          <button :class="{active:tab==='strings'}" @click="tab='strings'; onStringsTab()"
                  x-text="`${t('tab_strings')} (${totalStrings})`"></button>
          <button :class="{active:tab==='sensitive'}" @click="tab='sensitive'; computeSensitive()"
                  x-text="`${t('tab_sensitive')} (${sensitiveResults.length})`"></button>
          <span class="spacer"></span>
          <div class="exp">
            <a :href="exportURL('json')"><button class="ghost sm" x-text="t('export_json')"></button></a>
            <a :href="exportURL('md')"><button class="ghost sm" x-text="t('export_md')"></button></a>
            <a :href="exportURL('sbom')"><button class="ghost sm" x-text="t('export_sbom')"></button></a>
          </div>
        </div>

        <!-- DASHBOARD -->
        <div x-show="tab==='dashboard'">
          <div class="cards">
            <div class="card" :class="{clickable: findings.length>0}" @click="findings.length>0 && goToFindings()">
              <div class="n" x-text="findings.length"></div><div class="l" x-text="t('card_findings')"></div>
            </div>
            <div class="card" :class="{clickable: sevCount('critical')>0}" @click="sevCount('critical')>0 && goToFindings({sevOnly:'critical'})">
              <div class="n sev-crit" x-text="sevCount('critical')"></div><div class="l" x-text="t('card_critical')"></div>
            </div>
            <div class="card" :class="{clickable: sevCount('high')>0}" @click="sevCount('high')>0 && goToFindings({sevOnly:'high'})">
              <div class="n sev-high" x-text="sevCount('high')"></div><div class="l" x-text="t('card_high')"></div>
            </div>
            <div class="card" :class="{clickable: binaries.length>0}" @click="binaries.length>0 && (tab='binaries')">
              <div class="n" x-text="binaries.length"></div><div class="l" x-text="t('card_binaries')"></div>
            </div>
            <div class="card" :class="{clickable: cveCount>0}" @click="cveCount>0 && goToCves()">
              <div class="n" x-text="cveCount"></div><div class="l" x-text="t('card_cves')"></div>
            </div>
          </div>
          <div class="distro">
            <h3 x-text="t('by_severity')"></h3>
            <template x-for="s in SEVS" :key="s">
              <div class="drow clickable" x-show="sevCount(s)>0" @click="goToFindings({sevOnly:s})">
                <div class="k" :class="'sev-'+SHORT[s]" x-text="tSev(s)"></div>
                <div class="t"><span :class="'bg-'+SHORT[s]" :style="`width:${pct(sevCount(s))}%`"></span></div>
                <div class="v" x-text="sevCount(s)"></div>
              </div>
            </template>
          </div>
          <div class="distro">
            <h3 x-text="t('by_vuln_class')"></h3>
            <template x-for="vc in classCounts" :key="vc.k">
              <div class="drow clickable" @click="goToFindings({vclass:vc.k})">
                <div class="k" style="width:160px" x-text="vc.k"></div>
                <div class="t"><span class="bg-info" :style="`width:${pct(vc.n)}%`"></span></div>
                <div class="v" x-text="vc.n"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- FINDINGS -->
        <div x-show="tab==='findings'">
          <div class="filters">
            <div class="sevtog">
              <template x-for="s in SEVS" :key="s">
                <button :class="{on:f.sev[s]}" :style="f.sev[s]?`background:var(--${SHORT[s]});border-color:var(--${SHORT[s]})`:''"
                        @click="f.sev[s]=!f.sev[s]" x-text="tSev(s)[0].toUpperCase()" :title="tSev(s)"></button>
              </template>
            </div>
            <select x-model="f.vclass">
              <option value="" x-text="t('filter_all_classes')"></option>
              <template x-for="c in vclasses" :key="c"><option :value="c" x-text="c"></option></template>
            </select>
            <select x-model="f.triage">
              <option value="" x-text="t('filter_any_triage')"></option>
              <option value="new" x-text="tTriage('new')"></option>
              <option value="confirmed" x-text="tTriage('confirmed')"></option>
              <option value="false_positive" x-text="tTriage('false_positive')"></option>
              <option value="accepted_risk" x-text="tTriage('accepted_risk')"></option>
            </select>
            <input type="text" x-model="f.q" :placeholder="t('search_placeholder')">
            <label class="rng"><span x-text="t('conf_label')"></span>
              <input type="range" min="0" max="1" step="0.05" x-model.number="f.minConf" style="width:90px">
              <span x-text="f.minConf"></span>
            </label>
            <select x-model="sort">
              <option value="severity" x-text="t('sort_severity')"></option>
              <option value="confidence" x-text="t('sort_confidence')"></option>
            </select>
            <span class="count" x-text="filtered.length+' / '+findings.length"></span>
            <button class="ghost sm" @click="exportFilteredCSV()" x-text="t('export_filtered_csv')"></button>
            <button class="ghost sm" @click="exportFilteredJSON()" x-text="t('export_filtered_json')"></button>
          </div>

          <template x-if="!filtered.length"><div class="empty" x-text="t('no_findings_match')"></div></template>
          <template x-for="(f, fidx) in filtered" :key="f.id+'-'+fidx">
            <div class="finding" :class="SHORT[f.severity]" x-data="{open:false}">
              <div class="hd" @click="open=!open; if(open) triageHistoryFor(f.id)">
                <span class="sevtag" :class="'bg-'+SHORT[f.severity]" x-text="tSev(f.severity)"></span>
                <span class="t" x-text="f.title"></span>
                <span class="sub" style="margin:0" x-text="f.vuln_class+' · '+Math.round(f.confidence*100)+'%'"></span>
                <span x-show="(f.triage&&f.triage!=='new')" class="cur" :class="f.triage" x-text="tTriage(f.triage)"></span>
                <span x-show="f.cve_ids&&f.cve_ids.length" class="sub" style="margin:0" x-text="f.cve_ids.join(', ')"></span>
                <span x-text="open?'▾':'▸'"></span>
              </div>
              <div class="body" x-show="open">
                <div class="sub" x-text="t('component_label')+': '+f.component+'  ·  '+t('rule_label')+': '+f.rule+'  ·  '+t('id_label')+': '+f.id"></div>
                <div class="desc" x-text="f.description"></div>
                <template x-for="(e,i) in (f.evidence||[])" :key="i">
                  <div class="ev"><span class="loc" x-text="[e.binary,e.function,e.address].filter(Boolean).join(' : ')"></span><br>
                    <span x-text="e.snippet"></span>
                    <template x-if="e.taint_path && e.taint_path.length">
                      <div class="taint" x-text="'↳ '+e.taint_path.join(' → ')"></div>
                    </template>
                  </div>
                </template>
                <template x-if="f.pseudocode">
                  <details>
                    <summary style="cursor:pointer;color:var(--muted);font-size:12px;margin-top:8px" x-text="t('pseudocode_label')"></summary>
                    <pre class="code" x-text="f.pseudocode"></pre>
                  </details>
                </template>
                <div class="sub" x-show="f.remediation" x-text="'▸ '+f.remediation"></div>
                <div class="tristrip">
                  <span class="lab" x-text="t('triage_colon')"></span>
                  <button class="ghost sm" @click="setTriage(f,'confirmed')" x-text="t('btn_confirm')"></button>
                  <button class="ghost sm" @click="setTriage(f,'false_positive')" x-text="t('btn_false_positive')"></button>
                  <button class="ghost sm" @click="setTriage(f,'accepted_risk')" x-text="t('btn_accept_risk')"></button>
                  <button class="ghost sm" @click="setTriage(f,'new')" x-text="t('btn_reset')"></button>
                </div>
                <div class="sub" style="margin-top:8px">
                  <span x-text="t('triage_history_label')+':'"></span>
                  <template x-if="!(triageHistoryCache[f.id]&&triageHistoryCache[f.id].length)">
                    <span x-text="t('no_triage_history')"></span>
                  </template>
                  <template x-for="(e,i) in (triageHistoryCache[f.id]||[])" :key="i">
                    <div class="ev" style="padding:4px 8px">
                      <span x-text="logTime(e.time)"></span> — <span x-text="tTriage(e.state)"></span>
                      <span x-show="e.actor" x-text="' ('+e.actor+')'"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- BINARIES -->
        <div x-show="tab==='binaries'">
          <div class="table-wrap">
            <table class="bins">
              <thead><tr>
                <th x-text="t('th_binary')"></th><th x-text="t('th_arch')"></th><th x-text="t('th_libc')"></th>
                <th x-text="t('th_mitigations')"></th><th x-text="t('th_fns')"></th><th x-text="t('th_warnings')"></th>
                <th x-text="t('th_cves')"></th>
                <th x-text="t('th_strings')"></th>
              </tr></thead>
              <tbody>
                <template x-for="b in binaries" :key="b.path">
                  <tr>
                    <td class="path" :title="b.path" x-text="shortPath(b.path)"></td>
                    <td x-text="(b.arch||'?')+' '+(b.bits||'')+' '+(b.endian||'')+(b.is_library?' (lib)':'')"></td>
                    <td x-text="b.libc||'—'"></td>
                    <td x-html="mitChips(b.mitigations)"></td>
                    <td x-text="(b.functions&&b.functions.length)||0"></td>
                    <td>
                      <span x-show="b.warnings&&b.warnings.length" class="chip warn"
                            :title="(b.warnings||[]).join('\n')" x-text="'⚠ '+((b.warnings&&b.warnings.length)||0)"></span>
                      <span x-show="!(b.warnings&&b.warnings.length)">—</span>
                    </td>
                    <td>
                      <a href="#" x-show="cvesFor(b.path)" @click.prevent="goToCves(b.path)"
                         x-text="cvesFor(b.path)"></a>
                      <span x-show="!cvesFor(b.path)">—</span>
                    </td>
                    <td><a href="#" @click.prevent="tab='strings'; stringsBinary=b.path"
                           x-text="(b.strings&&b.strings.length)||0"></a></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- SCRIPTS -->
        <div x-show="tab==='scripts'">
          <template x-if="!scripts.length"><div class="empty" x-text="t('no_scripts')"></div></template>
          <div class="table-wrap" x-show="scripts.length">
            <table class="bins">
              <thead><tr>
                <th x-text="t('th_script')"></th><th x-text="t('th_kind')"></th><th x-text="t('th_findings')"></th>
              </tr></thead>
              <tbody>
                <template x-for="s in scripts" :key="s.path">
                  <tr>
                    <td class="path" :title="s.path" x-text="shortPath(s.path)"></td>
                    <td x-text="s.kind"></td>
                    <td>
                      <a href="#" x-show="s.findings" @click.prevent="goToFindings({q:s.path})" x-text="s.findings"></a>
                      <span x-show="!s.findings">0</span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- COMPONENTS -->
        <div x-show="tab==='components'">
          <template x-if="!components.length"><div class="empty" x-text="t('no_components')"></div></template>
          <div class="table-wrap" x-show="components.length">
            <table class="bins">
              <thead><tr>
                <th x-text="t('th_component')"></th><th x-text="t('th_version')"></th>
                <th x-text="t('th_binaries_col')"></th><th x-text="t('th_cves')"></th>
              </tr></thead>
              <tbody>
                <template x-for="c in components" :key="c.name+'@'+c.version">
                  <tr>
                    <td x-text="c.name"></td>
                    <td x-text="c.version"></td>
                    <td :title="(c.binaries||[]).join('\n')" x-text="(c.binaries&&c.binaries.length)||0"></td>
                    <td>
                      <a href="#" x-show="c.cve_ids&&c.cve_ids.length"
                         @click.prevent="goToFindings({vclass:'known_cve', q:c.name+'@'+c.version})"
                         x-text="(c.cve_ids||[]).join(', ')"></a>
                      <span x-show="!(c.cve_ids&&c.cve_ids.length)">—</span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- STRINGS -->
        <div x-show="tab==='strings'">
          <div class="filters">
            <select x-model="stringsBinary">
              <template x-for="b in binaries" :key="b.path">
                <option :value="b.path" x-text="shortPath(b.path)+' ('+((b.strings&&b.strings.length)||0)+')'"></option>
              </template>
            </select>
            <input type="text" x-model="stringsQuery" :placeholder="t('strings_search_placeholder')">
            <span class="count" x-text="filteredStrings.length+' / '+currentBinaryStrings.length"></span>
          </div>
          <template x-if="!binaries.length"><div class="empty" x-text="t('no_binaries')"></div></template>
          <template x-if="binaries.length && !filteredStrings.length"><div class="empty" x-text="t('no_strings_match')"></div></template>
          <pre class="code" style="max-height:70vh" x-show="filteredStrings.length" x-text="stringsText"></pre>
          <p class="meta" x-show="stringsTruncated" x-text="t('strings_truncated')"></p>
        </div>

        <!-- SENSITIVE STRINGS -->
        <div x-show="tab==='sensitive'">
          <p class="meta" style="margin-top:0">
            <span x-text="t('kw_current_count').replace('{n}', sensitiveKeywords.length)"></span>
            <button class="ghost sm" @click="toggleSensitiveDict()" x-text="t('kw_manage_btn')"></button>
          </p>
          <div class="filters">
            <select x-model="sensitiveBinary" @change="computeSensitive()">
              <option value="" x-text="t('filter_all_binaries')"></option>
              <template x-for="b in binaries" :key="b.path">
                <option :value="b.path" x-text="shortPath(b.path)"></option>
              </template>
            </select>
            <span class="count" x-text="sensitiveResults.length"></span>
          </div>
          <template x-if="!binaries.length"><div class="empty" x-text="t('no_binaries')"></div></template>
          <template x-if="binaries.length && !sensitiveResults.length"><div class="empty" x-text="t('no_sensitive_match')"></div></template>
          <div class="table-wrap" x-show="sensitiveResults.length">
            <table class="bins">
              <thead><tr>
                <th x-text="t('th_binary')"></th>
                <th x-text="t('th_keyword')"></th>
                <th x-text="t('th_string')"></th>
              </tr></thead>
              <tbody>
                <template x-for="(r,idx) in sensitiveResults" :key="idx">
                  <tr>
                    <td class="path" :title="r.binary" x-text="shortPath(r.binary)"></td>
                    <td><span class="chip warn" x-text="r.keyword"></span></td>
                    <td class="path" x-text="r.text"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <p class="meta" x-show="sensitiveTruncated" x-text="t('sensitive_truncated')"></p>
        </div>
      </div>
    </template>
  </div>
</main>
