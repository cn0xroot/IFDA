[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ifda"
version = "2.0.0"
description = "Automated IoT firmware binary analysis — reverse engineering & vulnerability discovery core"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "capstone>=4.0",
    "pyelftools>=0.29",
    # GPL-3.0, and deliberately only ever invoked as a subprocess (shutil.which
    # + subprocess.run in ifda/vuln/cve_bin_tool.py), never imported -- keeping
    # it at arm's length is what lets this project stay Apache-2.0.
    "cve-bin-tool>=3.4",
    "cryptography>=41.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Heavier engines wrapped opportunistically; the core degrades gracefully without them.
taint = ["angr>=9.2"]
# GPU-accelerated rootfs dir-breakdown pie chart rendering. Optional: the
# renderer probes for a usable CUDA device at runtime and falls back to CPU
# (Pillow, already a core dependency) automatically when this isn't
# installed or no GPU is present. Pick the cupy wheel matching the local
# CUDA toolkit version, e.g. cupy-cuda12x for CUDA 12.x.
cuda = ["cupy-cuda12x>=12.0"]

[project.scripts]
ifda = "ifda.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ifda*"]
